[package]
name = "lcars-app"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-nats = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
futures = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
home-proto = { workspace = true }
lcars-api-proto = { workspace = true }
lcars-sync = { workspace = true }
lcars-ui = { workspace = true }
voice-proto = { workspace = true }
cpal = "0.16"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "tracing"] }
image = { version = "0.25.8", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
tokio = { workspace = true, features = ["net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2.5.7"
ffmpeg-next = { version = "7.1.0", default-features = false, features = ["codec", "format", "software-scaling"] }

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
