name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential pkg-config git clang libclang-dev \
            libasound2-dev libfontconfig-dev libudev-dev libinput-dev \
            libgbm-dev libdrm-dev libxkbcommon-dev \
            libavcodec-dev libavutil-dev libswscale-dev
          curl -fsSL -o /tmp/nats.tar.gz \
            https://github.com/nats-io/nats-server/releases/download/v2.11.4/nats-server-v2.11.4-linux-amd64.tar.gz
          tar -C /tmp -xzf /tmp/nats.tar.gz
          mv /tmp/nats-server-v2.11.4-linux-amd64/nats-server /usr/local/bin/nats-server
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features --locked

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - name: Lint
        run: buf lint
      - name: Breaking
        run: |
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            buf breaking --against '.git#branch=origin/main'
          fi
